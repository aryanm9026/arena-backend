name: PR check
on: pull_request
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: PR title format
        env: { TITLE: "${{ github.event.pull_request.title }}" }
        run: echo "$TITLE" | grep -Eq '^\[(NATIVE|WEB|NODE)\] .+' || { echo "Title must look like: [NODE] Full Name - College"; exit 1; }
      - name: Protected paths untouched
        run: |
          if git diff --name-only "origin/${{ github.base_ref }}...HEAD" | grep -E '^(\.github/|\.githooks/|scripts/protect)'; then
            echo "You may not modify .github/, .githooks/ or scripts/protect*"; exit 1; fi
      - name: No committed secrets
        run: |
          if git diff --name-only "origin/${{ github.base_ref }}...HEAD" | grep -E '(^|/)\.env$'; then echo ".env must not be committed"; exit 1; fi
